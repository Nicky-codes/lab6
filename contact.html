<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create & Cafe | Creative Workshops</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container">
            <a class="navbar-brand" href="index.html">Create & Cafe</a>

            <button class="btn-icon navbar-toggler" type="button"
                data-bs-toggle="drawer" data-bs-target="#navbarDrawer"
                aria-controls="navbarDrawer" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <dialog class="drawer drawer-end" tabindex="-1"
                id="navbarDrawer" aria-labelledby="navbarDrawerLabel">

                <div class="drawer-header">
                    <h2 class="drawer-title" id="navbarDrawerLabel">Menu</h2>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>

                 <div class="drawer-body">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page"
                                href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#workshops">Workshops</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                    </ul>
                 </div>
            </dialog>
        </div>
    </nav>

    <main class="container py-5">
        
        <section class="text-center mb-5">
      <h1>Contact Us</h1>
      <p class="lead">
        Have a question or want to learn more about our workshops?
        Send us a message!
      </p>
    </section>

     <!-- CONTACT FORM -->
    <section class="container">
      <form action="#" method="get">

        <div class="row g-3">

          <!-- FIRST NAME -->
          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="firstName">First Name</label>
              <input class="form-control" type="text"
                id="firstName" name="firstName" required>
            </div>
          </div>

           <!-- LAST NAME -->
          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="lastName">Last Name</label>
              <input class="form-control" type="text"
                id="lastName" name="lastName" required>
            </div>
          </div>


          <!-- EMAIL -->
          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="email">Email Address</label>
              <input class="form-control" type="email"
                id="email" name="email"
                placeholder="name@example.com" required>
            </div>
          </div>

           <!-- SELECT -->
          <div class="col-12 md:col-6">
            <div class="form-field">
              <label for="interest">What activity are you interested in?</label>
              <select class="form-control" id="interest"
                name="interest" required>
                <option value="">Choose an option</option>
                <option value="painting">Canvas Painting</option>
                <option value="pottery">Pottery Painting</option>
                <option value="bracelets">Bracelet Making</option>
                <option value="candles">Candle Making</option>
                <option value="private">Private Workshops</option>
              </select>
            </div>
          </div>


          <!-- MESSAGE -->
          <div class="col-12">
            <div class="form-field">
              <label for="message">Your Message</label>
              <textarea class="form-control" id="message"
                name="message" rows="5" required></textarea>
            </div>
          </div>


          <!-- CONSENT CHECKBOX -->
          <div class="col-12">
            <div class="form-field">
              <div>
                <input class="check" type="checkbox"
                  id="consent" name="consent" required>
                <label for="consent">
                  I agree to be contacted about my inquiry.
                </label>
              </div>
            </div>
          </div>


          <!-- SUBMIT BUTTON -->
          <div class="col-12">
            <button class="btn-solid theme-primary" type="submit">
              Submit Message
            </button>
          </div>

        </div>
      </form>
    </section>


    </main>

    <footer class="container text-center py-4">
        <p>&copy; 2026 Create & Café. All rights reserved.</p>
        <a href="index.html">Back to Home</a>
    </footer>


    <script type="module" src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
